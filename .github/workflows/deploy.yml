name: CI – Verificar Build

# O Cloudflare Pages já faz o deploy automático a partir do GitHub.
# Este workflow apenas verifica se o build do Vite funciona corretamente,
# injetando os secrets como variáveis de ambiente para o build.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Injeta os GitHub Secrets como variáveis VITE_* para o build
      VITE_SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      VITE_GROQ_API_KEY_1:    ${{ secrets.GROQ_API_KEY_1 }}
      VITE_GROQ_API_KEY_2:    ${{ secrets.GROQ_API_KEY_2 }}
      VITE_GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build
        # ✅ O Cloudflare Pages (caloriav3) faz o deploy automaticamente
        # a partir deste commit via integração direta com o GitHub.
