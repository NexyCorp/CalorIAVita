<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NutrIA">
  <style>
    :root {
      --bg: #ECE1D4;
      --dark: #0E0415;
      --purple: #5B21B6;
      --purple-glow: rgba(91,33,182,0.4);
    }
    .bar, .wave, .petal, .spark, .word-dark1, .word-dark2, .word-purple {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
    }
    .bar { transform-origin: bottom center; }
    .bar1 { animation: barIn 560ms cubic-bezier(.22,1,.36,1) 60ms forwards; }
    .bar2 { animation: barIn 560ms cubic-bezier(.22,1,.36,1) 180ms forwards; }
    .bar3 { animation: barIn 560ms cubic-bezier(.22,1,.36,1) 300ms forwards; }
    @keyframes barIn {
      0% { opacity: 0; transform: scaleY(0); }
      70% { opacity: 1; transform: scaleY(1.08); }
      100% { opacity: 1; transform: scaleY(1); }
    }
    .wave { animation: waveSettle 700ms cubic-bezier(.16,1,.3,1) 520ms forwards; }
    @keyframes waveSettle {
      0% { opacity: 0; transform: scale(.96); }
      100% { opacity: 1; transform: scale(1); }
    }
    .petal { animation: petalIn 520ms cubic-bezier(.34,1.56,.64,1) 980ms forwards; }
    @keyframes petalIn {
      0% { opacity: 0; transform: scale(.4) rotate(-20deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    .spark {
      animation: sparkIn 620ms ease-out 1220ms forwards,
                 sparkTwinkle 2600ms ease-in-out 1900ms infinite;
    }
    @keyframes sparkIn {
      0% { opacity: 0; transform: scale(0) rotate(-90deg); }
      45% { opacity: 1; transform: scale(1.5) rotate(10deg); }
      70% { transform: scale(.85) rotate(-4deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes sparkTwinkle {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(14,4,21,0)); opacity: 1; }
      50% { filter: drop-shadow(0 0 6px rgba(14,4,21,.45)); opacity: .75; }
    }
    .icon-glow { animation: glowPulse 3400ms ease-in-out 1700ms infinite; }
    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 0 var(--purple-glow)); }
      50% { filter: drop-shadow(0 0 14px var(--purple-glow)); }
    }
    .word-dark1 { animation: wordIn 640ms cubic-bezier(.16,1,.3,1) 1480ms forwards; }
    .word-dark2 { animation: wordIn 640ms cubic-bezier(.16,1,.3,1) 1560ms forwards; }
    .word-purple {
      animation: wordIn 640ms cubic-bezier(.16,1,.3,1) 1640ms forwards,
                 yGlow 2200ms ease-in-out 2400ms 2;
    }
    @keyframes wordIn {
      0% { opacity: 0; transform: translateY(22px); filter: blur(7px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes yGlow {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(91,33,182,0)); }
      50% { filter: drop-shadow(0 0 10px rgba(91,33,182,.55)); }
    }
    .shimmer-clip { opacity: 0; animation: shimmerShow 10ms linear 2050ms forwards; }
    .shimmer-rect {
      transform: translateX(-70%) skewX(-18deg);
      animation: shimmerLoop 5200ms cubic-bezier(.37,0,.63,1) 2100ms infinite;
    }
    @keyframes shimmerShow { to { opacity: 1; } }
    @keyframes shimmerLoop {
      0% { transform: translateX(-70%) skewX(-18deg); }
      16%, 100% { transform: translateX(170%) skewX(-18deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar, .wave, .petal, .spark, .word-dark1, .word-dark2, .word-purple {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
      .shimmer-clip, .shimmer-rect { animation: none !important; opacity: 0 !important; }
    }
  </style>
